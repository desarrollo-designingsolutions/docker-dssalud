networks:
  project_network:
    driver: bridge

volumes:
  vue_dist: # Volumen compartido: el builder Vue escribe aquí, Nginx lo lee
  certbot_www: # Webroot para el challenge HTTP-01 de Certbot
  certbot_certs: # Certificados Let's Encrypt

services:
  # -------------------------------------------------------
  # PHP-FPM (Laravel backend)
  # -------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: ./docker/dockerfiles/php.Dockerfile
    user: "${DOCKER_UID}:${DOCKER_GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - project_network

  # -------------------------------------------------------
  # Vue 3 — build de producción
  # Genera /dist y lo escribe en el volumen compartido.
  # No expone ningún puerto; Nginx sirve los estáticos.
  # -------------------------------------------------------
  vue:
    container_name: ${COMPOSE_PROJECT_NAME}_vue
    build:
      context: .
      dockerfile: docker/dockerfiles/vue3-prod.dockerfile
    volumes:
      - vue_dist:/dist # el dist generado queda aquí
    networks:
      - project_network
    # no restart: el contenedor termina tras el build
    restart: "no"

  # -------------------------------------------------------
  # MySQL
  # -------------------------------------------------------
  mysql:
    image: mysql:8.0.1
    restart: unless-stopped
    tty: true
    container_name: ${COMPOSE_PROJECT_NAME}_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - project_network
    volumes:
      - ./docker/mysql_data:/var/lib/mysql

  # -------------------------------------------------------
  # Redis
  # -------------------------------------------------------
  redis_6379:
    image: redis:alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis_6379
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_1}:6379"
    volumes:
      - ./docker/redis_data_6379:/data
    networks:
      - project_network

  redis_6380:
    image: redis:alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis_6380
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_2}:6379"
    volumes:
      - ./docker/redis_data_6380:/data
    networks:
      - project_network

  # -------------------------------------------------------
  # Nginx — sirve API (Laravel) + Front (Vue estático)
  # -------------------------------------------------------
  server:
    image: nginx:1.28
    container_name: ${COMPOSE_PROJECT_NAME}_server
    restart: always
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./backend:/var/www/html
      # Config de producción con los 3 server blocks
      - ./docker/nginx/server.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Archivos estáticos compilados de Vue
      - vue_dist:/var/www/front/dist:ro
      # Certificados Let's Encrypt
      - certbot_certs:/etc/letsencrypt:ro
      # Webroot para renovación de Certbot
      - certbot_www:/var/www/certbot:ro
    environment:
      - NGINX_API_SERVER_NAME=${NGINX_API_SERVER_NAME}
      - NGINX_FRONT_SERVER_NAME=${NGINX_FRONT_SERVER_NAME}
      - SSL_CERT_PATH=${SSL_CERT_PATH}
      - SSL_KEY_PATH=${SSL_KEY_PATH}
    depends_on:
      - php
      - mysql
      - vue
    networks:
      - project_network

  # -------------------------------------------------------
  # Certbot — obtiene y renueva certificados Let's Encrypt
  # Uso:
  #   Primera vez:  docker compose -f docker-compose.server.yml run --rm certbot
  #   Renovación:   docker compose -f docker-compose.server.yml run --rm certbot renew
  # -------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: ${COMPOSE_PROJECT_NAME}_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Por defecto obtiene un certificado. El script deploy-server.sh llama esto.
    entrypoint: >
      certbot certonly
        --webroot
        --webroot-path=/var/www/certbot
        --email admin@desarrollo.com.co
        --agree-tos
        --no-eff-email
        --non-interactive
        --expand
        -d ${NGINX_FRONT_SERVER_NAME}
        -d ${NGINX_API_SERVER_NAME}

  # -------------------------------------------------------
  # Supervisord — Laravel Reverb (WebSockets)
  # -------------------------------------------------------
  supervisor_reverb:
    build:
      context: .
      dockerfile: ./docker/dockerfiles/supervisor.dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_supervisor_reverb
    volumes:
      - ./backend:/var/www/html
      - ./docker/supervisor/laravel-worker-reverb.conf:/etc/supervisor/conf.d/laravel-worker-reverb.conf
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - php
      - mysql
    networks:
      - project_network
    ports:
      - "8080:8080"
    environment:
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=${REVERB_HOST}
      - REVERB_PORT=${REVERB_PORT}
      - REVERB_SCHEME=${REVERB_SCHEME}

  # -------------------------------------------------------
  # Supervisord — Laravel Queues
  # -------------------------------------------------------
  supervisor_queues:
    build:
      context: .
      dockerfile: ./docker/dockerfiles/supervisor.dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/var/www/html
      - ./docker/supervisor/laravel-worker-queue.conf:/etc/supervisor/conf.d/laravel-worker-queue.conf
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - php
      - mysql
    networks:
      - project_network
